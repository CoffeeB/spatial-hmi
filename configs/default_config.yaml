camera:
  device_index: 0
  width: 1280
  height: 720
  target_fps: 30
  auto_reconnect: true
  reconnect_delay_sec: 1.0
  auto_zoom: true
  min_zoom: 1.0
  max_zoom: 3.5
  target_hand_scale: 0.32
  zoom_speed: 0.10
  pan_speed: 0.12
  hold_frames: 8

perception:
  max_num_hands: 2
  min_detection_confidence: 0.45
  min_tracking_confidence: 0.40
  model_complexity: 1

landmarks:
  palm_landmark_indices: [0, 5, 9, 17]
  wrist_index: 0
  middle_mcp_index: 9
  velocity_alpha: 0.40

gestures:
  pinch_threshold: 0.38
  pinch_steepness: 18.0
  point_extension_ratio: 1.18
  open_palm_extension_ratio: 1.12
  grab_closure_ratio: 0.90
  two_hand_spread_vel_threshold: 0.04
  two_hand_rotation_vel_threshold: 0.06
  min_confidence_threshold: 0.40

intent:
  evidence_lambda: 0.55
  activation_threshold: 0.50
  release_threshold: 0.25
  confirm_frames: 2
  candidate_frames: 1
  hand_loss_timeout_sec: 0.25

temporal_intent:
  windows:
    finger_window: 3
    pose_window: 5
    motion_window: 8
    gesture_window: 12
    two_hand_window: 16
  finger:
    smoothing_alpha: 0.65
    min_confidence: 0.80
    temporal_majority_threshold: 0.66
    jitter_deadzone_ndc: 0.0035
  pose:
    enter_threshold: 0.80
    exit_threshold: 0.45
    min_confirm_frames: 4
    max_oscillation_history: 10
  motion:
    min_velocity_threshold: 0.20
    stationary_velocity_threshold: 0.08
    direction_consistency_threshold: 0.82
    min_displacement: 0.035
    min_duration_ms: 80.0
    max_duration_ms: 380.0
    curvature_reject_threshold: 0.68
  swipe:
    min_velocity: 1.8
    min_distance: 140
    min_direction_consistency: 0.85
    min_duration_ms: 100.0
    max_duration_ms: 350.0
    min_linearity: 0.70
    refractory_period_ms: 220.0
  intent_fsm:
    activation_threshold: 0.50
    release_threshold: 0.25
    evidence_lambda: 0.75
    candidate_frames: 2
    confirm_frames: 4
    hand_loss_timeout_sec: 0.80
    release_cooldown_frames: 5
    easing_decay_rate: 0.85
  lock:
    lock_on_pinch: true
    lock_on_drag: true
    suppress_secondary_gestures: true
    timeout_sec: 3.0

stability:
  finger_window: 3
  pose_window: 5
  motion_window: 8
  gesture_window: 12
  two_hand_window: 16
  dead_zone_px: 18.0
  dead_zone_ndc: 0.025
  dead_zone_scale_with_dref: true
  enter_threshold: 0.88
  exit_threshold: 0.62
  point_hold_ms: 80.0
  pinch_hold_ms: 120.0
  fist_hold_ms: 150.0
  open_palm_hold_ms: 100.0
  default_hold_ms: 100.0
  weight_recognition: 0.35
  weight_temporal: 0.25
  weight_motion: 0.20
  weight_persistence: 0.20
  stability_threshold: 0.85
  tremor_speed_threshold: 0.18
  tremor_max_displacement: 0.020
  twitch_duration_ms: 70.0
  transition_min_duration_ms: 60.0
  transition_max_duration_ms: 350.0
  lock_exit_threshold: 0.45
  active_preservation_frames: 6

smoothing:
  filter_type: "one_euro" # "one_euro", "ema", or "none"
  one_euro:
    fc_min: 1.0
    beta: 0.007
    d_cutoff: 1.0
  dead_zone_radius: 0.003
  velocity_gate: 0.001

interaction:
  rotation_sensitivity: 2.8
  zoom_sensitivity: 1.8
  translation_sensitivity: 2.2
  screen_aspect_ratio: 1.7777777777777777 # 16:9

communication:
  host: "127.0.0.1"
  port: 8765
  broadcast_interval_ms: 16.66 # ~60 Hz
